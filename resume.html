<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Resume — Taksin Nisaphawanit (ทักษิณ นิสภวาณิชย์)</title>
  <meta name="description" content="เรซูเม่ของทักษิณ นิสภวาณิชย์ | Software Developer • Web Developer" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0c10;
      --bg-soft: #0d1016;
      --card: #121318;
      --text: #e8eef5;
      --muted: #9fb0c6;
      --primary: #4f8cff;
      --accent: #00d094;
      --border: #21222a;
      --ring: rgba(79, 140, 255, 0.4);
      --radius: 16px;
    }
    [data-theme="light"] {
      --bg: #f5f7fb;
      --bg-soft: #e9eef7;
      --card: #ffffff;
      --text: #0e1726;
      --muted: #51607a;
      --primary: #265bff;
      --accent: #00a878;
      --border: #e2e6f0;
      --ring: rgba(38, 91, 255, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Kanit", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.6;
    }

    /* Background Ambient Grids */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: linear-gradient(transparent 95%, rgba(127, 127, 127, 0.05) 95%),
                        linear-gradient(90deg, transparent 95%, rgba(127, 127, 127, 0.05) 95%);
      background-size: 24px 24px;
      z-index: -1;
    }

    /* Navigation Bar */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(11, 12, 16, 0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    [data-theme="light"] header {
      background: rgba(245, 247, 251, 0.88);
    }
    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.25s ease;
    }
    .btn-back:hover {
      border-color: var(--primary);
      color: var(--primary);
      transform: translateX(-3px);
      box-shadow: 0 4px 14px -4px var(--ring);
    }

    /* Language Switcher Tabs */
    .lang-switcher {
      display: flex;
      gap: 6px;
      background: var(--card);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .lang-btn {
      padding: 8px 16px;
      border-radius: 9px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.25s ease;
    }
    .lang-btn:hover {
      color: var(--text);
    }
    .lang-btn.active {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #ffffff;
      box-shadow: 0 4px 14px -4px var(--ring);
    }

    /* Action Controls Right */
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn-action {
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      text-decoration: none;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
      color: var(--primary);
      transform: translateY(-2px);
    }
    .btn-action.primary {
      background: linear-gradient(135deg, rgba(79, 140, 255, 0.15), rgba(0, 208, 148, 0.15));
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 600;
    }
    .btn-action.primary:hover {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
    }

    /* Main Container */
    main {
      flex: 1;
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 20px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Resume Info Banner */
    .resume-banner {
      width: 100%;
      max-width: 860px;
      text-align: center;
      margin-bottom: 20px;
    }
    .resume-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(79, 140, 255, 0.12), rgba(0, 208, 148, 0.12));
      border: 1px solid var(--border);
      font-size: 13px;
      color: var(--primary);
      font-weight: 500;
      margin-bottom: 8px;
    }
    .resume-title {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 4px;
      background: linear-gradient(135deg, var(--text), var(--primary));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .resume-subtitle {
      color: var(--muted);
      font-size: 14px;
    }

    /* Zoom Toolbar */
    .view-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding: 6px 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
    }
    .tool-btn {
      padding: 4px 10px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      border-radius: 6px;
      transition: all 0.2s ease;
    }
    .tool-btn:hover {
      background: rgba(127, 127, 127, 0.1);
      color: var(--text);
    }
    .zoom-level {
      font-family: "Inter", sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: var(--primary);
      min-width: 44px;
      text-align: center;
    }

    /* Resume Display Card Frame */
    .resume-wrapper {
      width: 100%;
      max-width: 860px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      transition: all 0.3s ease;
    }
    [data-theme="light"] .resume-wrapper {
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
    }

    .resume-img-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: auto;
    }

    .resume-img {
      width: auto;
      max-width: min(100%, 750px);
      height: auto;
      aspect-ratio: 723 / 1024;
      object-fit: contain;
      border-radius: 10px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
      display: block;
      margin: 0 auto;
      transition: transform 0.2s ease;
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--border);
      padding: 20px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    /* Print Stylesheet */
    @media print {
      header, .resume-banner, .view-toolbar, footer { display: none !important; }
      body { background: white !important; color: black !important; padding: 0 !important; margin: 0 !important; }
      main { padding: 0 !important; max-width: 100% !important; }
      .resume-wrapper { border: none !important; box-shadow: none !important; padding: 0 !important; background: transparent !important; }
      .resume-img { max-width: 100% !important; border-radius: 0 !important; box-shadow: none !important; }
    }

    /* Responsive */
    @media (max-width: 680px) {
      .nav-container { justify-content: center; gap: 10px; }
      .nav-left { width: 100%; justify-content: space-between; }
      .resume-title { font-size: 20px; }
      .resume-wrapper { padding: 8px; border-radius: 12px; }
    }
  </style>
</head>
<body>

  <!-- Navigation Header -->
  <header>
    <div class="nav-container">
      <div class="nav-left">
        <a href="index.html" class="btn-back" title="กลับไปหน้าหลัก Portfolio">
          <span>← กลับสู่หน้าหลัก Portfolio</span>
        </a>

        <!-- Language Switcher Tabs -->
        <div class="lang-switcher" role="tablist" aria-label="เลือกภาษาเรซูเม่">
          <button class="lang-btn active" id="btnLangTh" type="button" role="tab" aria-selected="true">
            <span>🇹🇭 ภาษาไทย</span>
          </button>
          <button class="lang-btn" id="btnLangEn" type="button" role="tab" aria-selected="false">
            <span>🇬🇧 English</span>
          </button>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="nav-actions">
        <button id="btnPrint" class="btn-action" title="พิมพ์เรซูเม่">🖨️ พิมพ์</button>
        <a id="btnDownload" href="images/resume-th.jpg" download="Resume_Taksin_TH.jpg" class="btn-action primary" title="ดาวน์โหลดเรซูเม่">
          <span>📥 ดาวน์โหลด</span>
        </a>
        <button id="themeToggle" class="btn-action" title="สลับโหมดมืด/สว่าง" aria-label="Toggle theme">🌓 สลับธีม</button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <div class="resume-banner">
      <span class="resume-badge" id="resumeBadge">🇹🇭 ฉบับภาษาไทย (Thai Version)</span>
      <h1 class="resume-title" id="resumeHeading">เรซูเม่ — ทักษิณ นิสภวาณิชย์</h1>
      <p class="resume-subtitle">สาขาเทคโนโลยีสารสนเทศ (IT) • Software Developer • Web Developer</p>
    </div>

    <!-- Zoom & Control Bar -->
    <div class="view-toolbar">
      <button id="btnZoomOut" class="tool-btn" title="ย่อขนาด">🔍 -</button>
      <span class="zoom-level" id="zoomText">100%</span>
      <button id="btnZoomIn" class="tool-btn" title="ขยายขนาด">🔍 +</button>
      <button id="btnZoomReset" class="tool-btn" title="ขนาดปกติ">↺ พอดีจอ</button>
    </div>

    <!-- Resume Image Viewer -->
    <div class="resume-wrapper">
      <div class="resume-img-container" id="zoomContainer">
        <img id="resumeImage" src="images/resume-th.jpg" alt="Taksin Nisaphawanit Resume (Thai)" class="resume-img" />
      </div>
    </div>
  </main>

  <footer>
    <p>© <span id="year"></span> Taksin Nisaphawanit • <a href="index.html" style="color:var(--primary);text-decoration:none">taksin105.github.io</a></p>
  </footer>

  <script>
    // ===== Theme Switcher =====
    const root = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const initialTheme = savedTheme || (prefersDark ? 'dark' : 'light');
    root.setAttribute('data-theme', initialTheme);

    themeToggle?.addEventListener('click', () => {
      const current = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      root.setAttribute('data-theme', current);
      localStorage.setItem('theme', current);
    });

    // ===== Language Switcher Logic =====
    const btnLangTh = document.getElementById('btnLangTh');
    const btnLangEn = document.getElementById('btnLangEn');
    const resumeImage = document.getElementById('resumeImage');
    const resumeBadge = document.getElementById('resumeBadge');
    const resumeHeading = document.getElementById('resumeHeading');
    const btnDownload = document.getElementById('btnDownload');

    function setLanguage(lang) {
      if (lang === 'en') {
        btnLangEn.classList.add('active');
        btnLangEn.setAttribute('aria-selected', 'true');
        btnLangTh.classList.remove('active');
        btnLangTh.setAttribute('aria-selected', 'false');

        resumeImage.src = 'images/resume-en.jpg';
        resumeImage.alt = 'Taksin Nisaphawanit Resume (English)';
        resumeBadge.textContent = '🇬🇧 English Version';
        resumeHeading.textContent = 'Resume — Taksin Nisaphawanit';
        btnDownload.href = 'images/resume-en.jpg';
        btnDownload.download = 'Resume_Taksin_EN.jpg';
        document.title = 'Resume (English) — Taksin Nisaphawanit';

        history.replaceState(null, '', '?lang=en');
      } else {
        btnLangTh.classList.add('active');
        btnLangTh.setAttribute('aria-selected', 'true');
        btnLangEn.classList.remove('active');
        btnLangEn.setAttribute('aria-selected', 'false');

        resumeImage.src = 'images/resume-th.jpg';
        resumeImage.alt = 'ทักษิณ นิสภวาณิชย์ เรซูเม่ (ภาษาไทย)';
        resumeBadge.textContent = '🇹🇭 ฉบับภาษาไทย (Thai Version)';
        resumeHeading.textContent = 'เรซูเม่ — ทักษิณ นิสภวาณิชย์';
        btnDownload.href = 'images/resume-th.jpg';
        btnDownload.download = 'Resume_Taksin_TH.jpg';
        document.title = 'เรซูเม่ (ภาษาไทย) — ทักษิณ นิสภวาณิชย์';

        history.replaceState(null, '', '?lang=th');
      }
    }

    btnLangTh.addEventListener('click', () => setLanguage('th'));
    btnLangEn.addEventListener('click', () => setLanguage('en'));

    // Check URL query on initial load: e.g. resume.html?lang=en
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('lang') === 'en') {
      setLanguage('en');
    } else {
      setLanguage('th');
    }

    // ===== Zoom Controls =====
    let currentZoom = 100;
    const zoomText = document.getElementById('zoomText');

    function applyZoom(zoom) {
      currentZoom = Math.max(60, Math.min(200, zoom));
      zoomText.textContent = `${currentZoom}%`;
      resumeImage.style.transform = `scale(${currentZoom / 100})`;
      resumeImage.style.transformOrigin = 'top center';
    }

    document.getElementById('btnZoomIn')?.addEventListener('click', () => applyZoom(currentZoom + 15));
    document.getElementById('btnZoomOut')?.addEventListener('click', () => applyZoom(currentZoom - 15));
    document.getElementById('btnZoomReset')?.addEventListener('click', () => applyZoom(100));

    // ===== Print Button =====
    document.getElementById('btnPrint')?.addEventListener('click', () => {
      window.print();
    });

    // ===== Keyboard Shortcuts =====
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        window.location.href = 'index.html';
      }
    });

    // ===== Current Year =====
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
